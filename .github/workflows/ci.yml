name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Deduplication and isolation rely on PostgreSQL constraints: tests run against a real one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: financepro
          POSTGRES_PASSWORD: financepro
          POSTGRES_DB: financepro
        ports: ["5437:5432"]
        options: >-
          --health-cmd "pg_isready -U financepro -d financepro"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://financepro:financepro@localhost:5437/financepro
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests migrations
      # Every model change ships with its migration.
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest
      - run: docker build -t financepro-api .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
